---
debug: false
contextTimeout: 10s

server:
    metrics: true
    readinessTimeout: 2s
    address: ":8080"
    readHeaderTimeout: 5s
    readTimeout: 15s
    writeTimeout: 15s
    idleTimeout: 60s
    shutdownTimeout: 10s
    maxBodyBytes: 1048576
    corsOrigins:
        - "http://localhost:3000"
database:
    enabled: false
    driver: "mysql"
    host: "mysql"
    port: 3306
    database: "test"
    username: "app"
    password: ""
    maxIdleConns: 20
    maxOpenConns: 100
    connMaxLifetime: 5m
    charset: "utf8mb4"
    timeZone: "Local"
    name: "db_test"

redis:
    enabled: false
    name: "test"
    proto: "tcp"
    addr: "redis:6379"
    auth: ""
    db: 0
    dialTimeout: 5s
    readTimeout: 1s
    writeTimeout: 1s
    slowLog: 200ms
    pool:
        active: 100
        idle: 10
        waitTimeout: 2s
        wait: true


mongodb:
    enabled: false
    uri: "mongodb://mongo:27017"
    authSource: "admin"
    user: ""
    password: ""
    database: "test"
    maxPoolSize: 20
    minPoolSize: 2
    connectTimeout: 5s

prometheus:
    enabled: false
    url: "http://prometheus:9090"
    token: ""
    timeout: 5s




lark:
    enabled: false
    appID: ""
    appSecret: ""
    timeout: 10s



log:
    output: "stdout"
    fileName: "logs/go-starter.log"
    logLevel: 0
    maxSizeMB: 20
    maxBackupCount: 30
    maxKeepDays: 7

key:
    type: "key"
    basic:
        user: ""
        password: ""
    ak:
        accessKey: ""
        secretKey: ""
    jwt:
        namespace: "go-starter"
        secret: ""
        expire: 2h
        issuer: "go-starter"

cron:
    on: false
